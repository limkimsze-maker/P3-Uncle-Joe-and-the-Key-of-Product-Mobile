name: Patch Resume And Restart
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); s=s.replace(">Hold 2s to Reset<",">Restart Game<").replace("<b>Reset Progress</b>","<b>Restart Game</b>"); marker='"'"'document.getElementById("coverStartBtn").addEventListener("click",()=>{'"'"'; i=s.find(marker); j=s.find("});",i) if i>=0 else -1; block=s[i:j+3] if i>=0 and j>i else ""; block2=block.replace("setupOpeningStart(true);","if(!progressLoaded) setupOpeningStart(true);",1) if "setupOpeningStart(true);" in block and "if(!progressLoaded)" not in block else block; s=s[:i]+block2+s[j+3:] if block and block2!=block else s; p.write_text(s,encoding="utf-8")'
      - name: Commit
        shell: bash
        run: |
          git config user.name "limkimsze-maker"
          git config user.email "lim_kim_sze@moe.edu.sg"
          git add index.html
          git commit -m "Resume saved stage and add Restart Game" || exit 0
          git push
